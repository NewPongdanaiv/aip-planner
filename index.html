*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:linear-gradient(135deg,#0f766e,#0d9488 55%,#14b8a6);padding:16px}
